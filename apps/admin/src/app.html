<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
		%sveltekit.head%
		<style>
			:root {
				--color-primary: #141414;
				--color-on-primary: #ffffff;
				--color-ink: #141414;
				--color-ink-soft: #262626;
				--color-text-muted: #707070;
				--color-text-faint: #adadad;
				--color-canvas: #ffffff;
				--color-canvas-soft: #f3f3f3;
				--color-field: #f0f0f0;
				--color-hairline-soft: #f0f0f0;
				--color-hairline: #e0e0e0;
				--color-accent: #0066ff;

				--radius-sm: 16px;
				--radius-md: 24px;
				--radius-full: 9999px;
			}

			*, *::before, *::after {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 0;
				background-color: #ffffff;
				color: #141414;
				font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}

			a {
				color: inherit;
				text-decoration: none;
			}

			button {
				font-family: inherit;
			}

			/* Floating Nav Pill */
			.nav-pill {
				background-color: var(--color-canvas-soft);
				border-radius: var(--radius-full);
				padding: 8px 12px 8px 24px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				max-width: 960px;
				margin: 24px auto 40px auto;
			}

			.nav-links {
				display: flex;
				align-items: center;
				gap: 12px;
			}

			.nav-link {
				font-size: 14px;
				font-weight: 500;
				color: var(--color-ink-soft);
				padding: 8px 14px;
				border-radius: var(--radius-full);
				transition: background-color 0.15s ease, color 0.15s ease;
			}

			.nav-link:hover, .nav-link.active {
				background-color: var(--color-canvas);
				color: var(--color-ink);
			}

			/* Buttons */
			.btn-primary {
				background-color: var(--color-primary);
				color: var(--color-on-primary);
				font-size: 14px;
				font-weight: 600;
				border-radius: var(--radius-full);
				padding: 10px 20px;
				border: none;
				cursor: pointer;
				display: inline-flex;
				align-items: center;
				gap: 8px;
				text-decoration: none;
				transition: opacity 0.15s ease, transform 0.05s ease;
			}
			.btn-primary:hover {
				opacity: 0.9;
			}
			.btn-primary:active {
				transform: scale(0.98);
			}
			.btn-primary:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			.btn-outline {
				background-color: var(--color-canvas);
				color: var(--color-ink);
				font-size: 14px;
				font-weight: 600;
				border: 1px solid var(--color-hairline);
				border-radius: var(--radius-full);
				padding: 9px 18px;
				cursor: pointer;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				text-decoration: none;
				transition: background-color 0.15s ease, border-color 0.15s ease;
			}
			.btn-outline:hover {
				background-color: var(--color-canvas-soft);
				border-color: #d0d0d0;
			}

			.btn-pill-soft {
				background-color: var(--color-canvas-soft);
				color: var(--color-ink);
				font-size: 13px;
				font-weight: 600;
				border-radius: var(--radius-full);
				padding: 6px 14px;
				border: none;
				cursor: pointer;
				display: inline-flex;
				align-items: center;
				gap: 4px;
				text-decoration: none;
				transition: background-color 0.15s ease;
			}
			.btn-pill-soft:hover {
				background-color: #eaeaea;
			}

			.btn-danger-soft {
				background-color: #fff0f0;
				color: #d32f2f;
				font-size: 13px;
				font-weight: 600;
				border-radius: var(--radius-full);
				padding: 6px 14px;
				border: none;
				cursor: pointer;
				display: inline-flex;
				align-items: center;
				transition: background-color 0.15s ease;
			}
			.btn-danger-soft:hover {
				background-color: #ffe0e0;
			}

			/* Badges */
			.badge-popular {
				background-color: var(--color-accent);
				color: var(--color-on-primary);
				font-size: 11px;
				font-weight: 600;
				letter-spacing: 0.02em;
				padding: 4px 10px;
				border-radius: var(--radius-full);
				display: inline-flex;
				align-items: center;
			}

			.badge-draft {
				background-color: var(--color-field);
				color: var(--color-text-muted);
				font-size: 11px;
				font-weight: 600;
				letter-spacing: 0.02em;
				padding: 4px 10px;
				border-radius: var(--radius-full);
				display: inline-flex;
				align-items: center;
			}

			/* Form Controls */
			.form-card {
				background-color: var(--color-canvas);
				border: 1px solid var(--color-hairline);
				border-radius: var(--radius-md);
				padding: 32px;
				box-sizing: border-box;
				width: 100%;
			}

			.input-field {
				background-color: var(--color-field);
				border: 2px solid transparent;
				border-radius: var(--radius-sm);
				padding: 12px 16px;
				font-size: 15px;
				color: var(--color-ink);
				outline: none;
				width: 100% !important;
				box-sizing: border-box;
				font-family: inherit;
				transition: border-color 0.15s ease, background-color 0.15s ease;
			}
			.input-field:focus {
				border-color: var(--color-ink);
				background-color: var(--color-canvas);
			}
			.input-field::placeholder {
				color: var(--color-text-faint);
			}

			/* Segmented Control */
			.segmented-control {
				background-color: var(--color-canvas-soft);
				border-radius: var(--radius-full);
				padding: 4px;
				display: inline-flex;
				gap: 4px;
			}

			.segment-item {
				padding: 6px 16px;
				font-size: 13px;
				font-weight: 500;
				border-radius: var(--radius-full);
				border: none;
				background: transparent;
				color: var(--color-text-muted);
				cursor: pointer;
				transition: background-color 0.15s ease, color 0.15s ease;
			}
			.segment-item.active {
				background-color: var(--color-canvas);
				color: var(--color-ink);
				font-weight: 600;
			}

			/* Table Card */
			.table-card {
				background-color: var(--color-canvas);
				border: 1px solid var(--color-hairline);
				border-radius: var(--radius-md);
				overflow: hidden;
				width: 100%;
			}

			.data-table {
				width: 100%;
				border-collapse: collapse;
				text-align: left;
			}

			.data-table th {
				background-color: var(--color-canvas-soft);
				color: var(--color-text-muted);
				font-size: 12px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				padding: 14px 20px;
				border-bottom: 1px solid var(--color-hairline-soft);
			}

			.data-table td {
				padding: 16px 20px;
				border-bottom: 1px solid var(--color-hairline-soft);
				font-size: 14px;
				vertical-align: middle;
			}

			.data-table tr:last-child td {
				border-bottom: none;
			}

			.data-table tr:hover td {
				background-color: #fafafa;
			}

			/* Squircle thumbnail */
			.squircle-thumb {
				width: 44px;
				height: 44px;
				border-radius: 30%;
				object-fit: cover;
				background-color: var(--color-canvas-soft);
				border: 1px solid var(--color-hairline);
				display: inline-block;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
